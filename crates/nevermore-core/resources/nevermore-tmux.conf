# Nevermore Dedicated tmux Configuration
# Socket: tmux -L nevermore

set -g status off
set -g prefix None
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g window-size latest
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,vte*:Tc,foot:Tc"
set -g set-clipboard on
set -g focus-events on

# Mouse wheel smooth scrolling in copy mode
bind -n WheelUpPane if -Ft= "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
