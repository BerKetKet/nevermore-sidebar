[package]
name = "nevermore-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nevermore-ui"
path = "src/main.rs"

[dependencies]
nevermore-core = { workspace = true }
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
vte4 = { version = "0.10", features = ["v0_84"] }
