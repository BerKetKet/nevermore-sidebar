[package]
name = "nevermore-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nevermore-ui"
path = "src/main.rs"

[lib]
name = "nevermore_ui"
path = "src/lib.rs"

[dependencies]
nevermore-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gtk4 = { version = "=0.11.5", features = ["v4_14"] }
gtk4-layer-shell = { version = "=0.8.1", features = ["v1_3"] }
vte4 = { version = "=0.10.0", features = ["v0_84"] }
glib = { version = "=0.22.10" }
gio = { version = "=0.22.10" }
async-channel = "2.5.0"
libc = { workspace = true }
